name: Verify

# Runs the offline build, tests and output checks on every pull request.
# It needs no secrets and deploys nothing; deploy-cloudflare-pages.yml deploys main.
on:
  pull_request:

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, test and check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install build dependencies
        run: npm ci

      - name: Build, test and check
        run: npm run verify
