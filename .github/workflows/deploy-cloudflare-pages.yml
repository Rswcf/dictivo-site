name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - desktop-release-published
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dictivo.app
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Sync desktop release metadata and generate site
        env:
          # Normal desktop releases send a complete release manifest here, so
          # this public site repo does not need read access to the private app repo.
          DICTIVO_RELEASE_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          GITHUB_TOKEN: ${{ github.token }}
          # Optional fallback for manual/scheduled runs without a dispatch payload.
          DICTIVO_DESKTOP_TOKEN: ${{ secrets.DICTIVO_DESKTOP_TOKEN }}
          DICTIVO_DESKTOP_RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          node scripts/sync-latest-release.mjs
          node scripts/generate-site.mjs

      - name: Check Cloud Fast checkout route
        run: node scripts/check-cloud-fast-checkout.mjs

      - name: Check Local checkout route
        run: node scripts/check-local-checkout.mjs

      - name: Check checkout pages are live
        run: node scripts/check-checkout-live.mjs

      - name: Check release payload sync
        run: node scripts/check-release-payload-sync.mjs

      - name: Check asset versioning
        run: node scripts/check-asset-version.mjs

      - name: Check public output surface
        run: node scripts/check-public-output.mjs

      - name: Inject commit SHA into asset URLs
        run: node scripts/inject-asset-version.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.90.1 pages deploy dist --project-name=dictivo-app --branch=main

      - name: Purge Cloudflare cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ALLOW_PURGE_FAILURE: "true"
        run: node scripts/purge-cloudflare-cache.mjs
