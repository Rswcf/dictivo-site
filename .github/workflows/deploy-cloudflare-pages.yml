name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - desktop-release-published
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dictivo.app
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install build dependencies
        run: npm ci

      - name: Validate Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Sync desktop release metadata and generate site
        env:
          # Normal desktop releases send a complete release manifest here, so
          # this public site repo does not need read access to the private app repo.
          DICTIVO_RELEASE_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          GITHUB_TOKEN: ${{ github.token }}
          # Optional fallback for manual/scheduled runs without a dispatch payload.
          DICTIVO_DESKTOP_TOKEN: ${{ secrets.DICTIVO_DESKTOP_TOKEN }}
          DICTIVO_DESKTOP_RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          node scripts/sync-latest-release.mjs
          node scripts/generate-site.mjs

      - name: Run unit and build-output tests
        run: npm test

      - name: Check Cloud Fast checkout route
        run: node scripts/check-cloud-fast-checkout.mjs

      - name: Check Local checkout route
        run: node scripts/check-local-checkout.mjs

      - name: Check checkout pages are live
        run: node scripts/check-checkout-live.mjs

      - name: Check release payload sync
        run: node scripts/check-release-payload-sync.mjs

      - name: Check asset versioning
        run: node scripts/check-asset-version.mjs

      - name: Check public output surface
        run: node scripts/check-public-output.mjs

      - name: Check website attribution
        run: node scripts/check-web-attribution.mjs

      - name: Check product film delivery
        run: node scripts/check-product-film.mjs

      - name: Fingerprint CSS and JavaScript assets
        run: node scripts/inject-asset-version.mjs

      - name: Save the live sitemap for IndexNow
        # IndexNow then submits only URLs this deployment adds, re-dates or removes.
        # If the live sitemap cannot be read, it submits every URL; the deploy goes on.
        run: |
          curl -fsS --max-time 20 https://dictivo.app/sitemap.xml -o "$RUNNER_TEMP/live-sitemap.xml" \
            || { rm -f "$RUNNER_TEMP/live-sitemap.xml"; echo "::warning::Could not read the live sitemap; IndexNow will submit every URL."; }

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.90.1 pages deploy dist --project-name=dictivo-app --branch=main

      - name: Check live language routing
        run: node scripts/check-locale-routing-live.mjs https://dictivo.app

      - name: Submit changed sitemap URLs to IndexNow
        # A rejection must remain visible as a failed step. The site has already
        # deployed at this point; submission failure does not roll it back.
        env:
          INDEXNOW_PREVIOUS_SITEMAP: ${{ runner.temp }}/live-sitemap.xml
        run: node scripts/submit-indexnow.mjs
