name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - desktop-release-published
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dictivo.app
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Sync desktop release metadata and generate site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional PAT with read access to the private desktop repo. When set,
          # release metadata refreshes live; when absent, sync keeps the
          # committed data/release.json instead of failing the deploy.
          DICTIVO_DESKTOP_TOKEN: ${{ secrets.DICTIVO_DESKTOP_TOKEN }}
          DICTIVO_DESKTOP_RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          node scripts/sync-latest-release.mjs
          node scripts/generate-site.mjs

      - name: Check Cloud Fast checkout route
        run: node scripts/check-cloud-fast-checkout.mjs

      - name: Check Local checkout route
        run: node scripts/check-local-checkout.mjs

      - name: Check asset versioning
        run: node scripts/check-asset-version.mjs

      - name: Check public output surface
        run: node scripts/check-public-output.mjs

      - name: Inject commit SHA into asset URLs
        run: node scripts/inject-asset-version.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0a78c0c34d3e08a9297247ce98d44ad1
          wranglerVersion: 4.90.1
          command: pages deploy dist --project-name=dictivo-app --branch=main
